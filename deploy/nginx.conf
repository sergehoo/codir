# Nginx reverse-proxy CODIR — TLS, websockets, static, rate-limit.
#
# ⚠ DÉPRÉCIÉ EN PRODUCTION : ce fichier est conservé pour les déploiements
# legacy. La prod active utilise Traefik (voir docker-compose.prod.yml).
# Les limites d'upload sont définies via les labels Traefik et via la config
# statique du host (timeouts respondingTimeouts dans /etc/traefik/traefik.yml).

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65s;
    server_tokens off;

    # Taille max de l'upload HTTP. Calibré pour les enregistrements audio
    # de réunions longues (jusqu'à 2-3h en webm/opus ~256 kbps ≈ 300 Mo).
    # Avant : 25M → un fichier 80 Mo était coupé à ~32%.
    client_max_body_size 600M;
    client_body_buffer_size 1m;
    client_body_timeout 600s;

    # ── Rate limits ────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ── Upstreams ──────────────────────────────────────
    upstream codir_api  { server api:8000; keepalive 32; }
    upstream codir_asgi { server asgi:8001; keepalive 32; }
    upstream codir_web  { server web:80;   keepalive 32; }

    # ── HTTP -> HTTPS ──────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ──────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Sécurité headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Auth : rate-limit serré ───────────────────
        location ~ ^/api/v1/auth/(login|password) {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://codir_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Upload audio (gros payloads, sans rate-limit) ─────
        # Localisation dédiée pour les endpoints d'upload des enregistrements :
        # on lève les timeouts à 10 min et on désactive le rate-limit (sinon
        # un envoi morcelé en plusieurs requêtes serait bloqué). Doit être
        # déclaré AVANT la location /api/ générique pour matcher en premier.
        location ~ ^/api/v1/(meetings/[^/]+/recordings|recordings)/ {
            proxy_pass http://codir_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Gros uploads : on désactive le buffering pour ne pas accumuler
            # 600 Mo en RAM sur nginx avant de forwarder au backend.
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 600M;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # ── API REST ──────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://codir_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Health probes (publics) ───────────────────
        location /health/ {
            access_log off;
            proxy_pass http://codir_api;
        }

        # ── Admin ─────────────────────────────────────
        location /admin/ {
            proxy_pass http://codir_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket (Daphne) ────────────────────────
        location /ws/ {
            proxy_pass http://codir_asgi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ── Static Django (admin) ─────────────────────
        location /static/ {
            proxy_pass http://codir_api;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # ── OpenAPI docs ──────────────────────────────
        location /docs/ {
            proxy_pass http://codir_api;
        }

        # ── Frontend SPA (par défaut) ─────────────────
        location / {
            proxy_pass http://codir_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
