# Traefik — configuration statique CODIR (prod).
# Variables d'env attendues (.env.prod) :
#   TRAEFIK_ACME_EMAIL
#   TRAEFIK_DASHBOARD_HOST

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - secure-headers@file

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: codir-prod
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{env \"TRAEFIK_ACME_EMAIL\"}}"
      storage: /acme/acme.json
      tlsChallenge: {}

log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  filters:
    statusCodes: ["400-599"]

api:
  dashboard: true
  insecure: false
