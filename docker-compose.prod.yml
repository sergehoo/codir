# ─────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — PRODUCTION CODIR
#
# Pré-requis : un fichier .env.prod à la racine (jamais commité)
# contenant DJANGO_SECRET_KEY, POSTGRES_PASSWORD, EMAIL_HOST_PASSWORD,
# JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, SENTRY_DSN, etc.
#
# Démarrage :
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Différences vs dev :
#  - Gunicorn 4 workers (pas runserver)
#  - DEBUG=False, ALLOWED_HOSTS strictement défini
#  - Storage volumes externes (montés depuis un disque persistant)
#  - Healthchecks et restart policies stricts
#  - Pas de MinIO ni de MailHog (S3 + SMTP externes)
#  - Pas de partage de code (image builée)
#  - Nginx en frontal avec TLS
# ─────────────────────────────────────────────────────────────────

x-common-env: &common-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?must be set}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?must be set}
  # DB
  POSTGRES_DB: ${POSTGRES_DB:-codir}
  POSTGRES_USER: ${POSTGRES_USER:-codir}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PG_SSLMODE: ${PG_SSLMODE:-require}
  # Cache / Queue
  REDIS_URL: ${REDIS_URL:?must be set}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?must be set}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  # Storage S3 (AWS, GCS-compat, OVH, Scaleway…)
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?must be set}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?must be set}
  S3_BUCKET: ${S3_BUCKET:?must be set}
  S3_REGION: ${S3_REGION:-eu-west-1}
  # Email
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:?must be set}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?must be set}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?must be set}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?must be set}
  # JWT RS256
  JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?must be set}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?must be set}
  # Observability
  SENTRY_DSN: ${SENTRY_DSN}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  # Misc
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?must be set}
  CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Africa/Abidjan}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?must be set}

x-app-build: &app-build
  image: ${CODIR_IMAGE:-codir-api:latest}
  build:
    context: .
    target: runtime
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# ─────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codir}
      POSTGRES_USER: ${POSTGRES_USER:-codir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codir} -d ${POSTGRES_DB:-codir}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    # En prod réelle on conseille fortement un Postgres managé (RDS, CloudSQL…).

  redis:
    image: redis:7-alpine
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:?must be set}",
      "--maxmemory", "1gb",
      "--maxmemory-policy", "allkeys-lru",
      "--appendonly", "yes"
    ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5
    restart: always

  # ── Application ────────────────────────────────────────────────

  api:
    <<: *app-build
    command: ["/app/scripts/docker-entrypoint.sh", "prod"]
    environment:
      <<: *common-env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose: ["8000"]

  asgi:
    <<: *app-build
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001",
              "--proxy-headers", "config.asgi:application"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }
    expose: ["8001"]

  worker-default:
    <<: *app-build
    command: ["celery", "-A", "config", "worker",
              "-Q", "default,celery", "-l", "info",
              "--concurrency=4", "-n", "default@%h"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  worker-notifications:
    <<: *app-build
    command: ["celery", "-A", "config", "worker",
              "-Q", "notifications", "-l", "info",
              "--concurrency=4", "-n", "notifications@%h"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  worker-reports:
    <<: *app-build
    command: ["celery", "-A", "config", "worker",
              "-Q", "reports", "-l", "info",
              "--concurrency=2", "-n", "reports@%h"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *app-build
    command: ["celery", "-A", "config", "beat", "-l", "info",
              "-S", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  # ── Frontend (statique servi par Nginx) ───────────────────────

  web:
    image: ${CODIR_WEB_IMAGE:-codir-web:latest}
    build:
      context: ../frontend/web
      args:
        VITE_API_BASE: ${VITE_API_BASE:?must be set}
        VITE_FRONTEND_URL: ${FRONTEND_BASE_URL}
    restart: always
    expose: ["80"]
    depends_on: [api]

  # ── Reverse proxy ─────────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on: [api, asgi, web]
    restart: always

# ─────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  default:
    name: codir-prod
