# ─────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — PRODUCTION CODIR
#
# Traefik tourne déjà sur le serveur. CODIR rejoint :
#   - `proxy`            : réseau externe partagé avec Traefik (TLS/routing)
#   - `codir_network`    : réseau interne (DB/Redis/Celery ↔ API)
#
# Le réseau `proxy` doit exister sur l'hôte :
#     docker network ls | grep proxy
#     # sinon : docker network create proxy
#
# Pré-requis : .env.prod (jamais commit) avec CODIR_HOST, CODIR_API_HOST,
# POSTGRES_PASSWORD, REDIS_PASSWORD, DJANGO_SECRET_KEY, JWT_*, etc.
#
# Démarrage :
#     docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ─────────────────────────────────────────────────────────────────

# ─── Anchors réutilisables ──────────────────────────────────────

x-logging: &logging_rotated
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-common-env: &common-env
  TZ: Africa/Abidjan
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?must be set}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?must be set}
  # DB
  POSTGRES_DB: ${POSTGRES_DB:-codir}
  POSTGRES_USER: ${POSTGRES_USER:-codir}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
  POSTGRES_HOST: codirDB
  POSTGRES_PORT: "5432"
  # Cache / Queue
  REDIS_URL: redis://:${REDIS_PASSWORD:?must be set}@codirredis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@codirredis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@codirredis:6379/1
  # Storage S3
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?must be set}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?must be set}
  S3_BUCKET: ${S3_BUCKET:?must be set}
  S3_REGION: ${S3_REGION:-eu-west-1}
  # ⚠ Défaut VIDE (pas AES256) : seul AWS S3 supporte SSE nativement.
  # Sur MinIO/self-hosted, SSE force MinIO à demander une clé KMS et plante :
  # "NotImplemented: Server side encryption specified but KMS is not configured".
  # Pour activer SSE sur AWS uniquement : S3_SSE=AES256 dans .env.prod
  S3_SSE: ${S3_SSE:-}
  # Email
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:?must be set}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?must be set}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?must be set}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?must be set}
  # JWT
  JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?must be set}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?must be set}
  # Observability
  SENTRY_DSN: ${SENTRY_DSN}
  # Misc
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?must be set}
  CELERY_TIMEZONE: ${CELERY_TIMEZONE:-Africa/Abidjan}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?must be set}
  FORWARDED_ALLOW_IPS: "*"
  PYTHONUNBUFFERED: "1"

# ─────────────────────────────────────────────────────────────────

services:

  # ── Base Postgres ─────────────────────────────────────────────
  codirDB:
    image: postgres:16
    restart: unless-stopped
    environment:
      TZ: Africa/Abidjan
      POSTGRES_DB: ${POSTGRES_DB:-codir}
      POSTGRES_USER: ${POSTGRES_USER:-codir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
    volumes:
      - codir_pgdata:/var/lib/postgresql/data
    networks: [codir_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    logging: *logging_rotated
    cpus: "1.5"
    mem_limit: 1500m
    mem_reservation: 512m
    ulimits:
      nofile: 65535

  # ── Redis (cache + broker Celery) ─────────────────────────────
  codirredis:
    image: redis:7
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:?must be set}",
      "--appendonly", "yes",
      "--appendfsync", "everysec",
      "--save", "900 1",
      "--maxmemory", "1gb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    environment:
      TZ: Africa/Abidjan
      REDIS_PASSWORD: ${REDIS_PASSWORD:?must be set}
    volumes:
      - codir_redisdata:/data
    networks: [codir_network]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a \"$$REDIS_PASSWORD\" ping | grep PONG >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    logging: *logging_rotated
    cpus: "0.7"
    mem_limit: 512m
    mem_reservation: 256m
    ulimits:
      nofile: 65535

  # ── MinIO (stockage S3 compatible — audio des réunions, documents) ──
  # Endpoint S3 interne sur :9000, console admin sur :9001.
  # Exposé via Traefik :
  #   storage-codir.datarium-dev.com         → API S3 (URLs présignées)
  #   codir-minio-console.datarium-dev.com   → Console admin web
  codirminio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: Africa/Abidjan
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must be set}
      # Region affiché dans les headers S3 — doit matcher S3_REGION côté Django.
      MINIO_REGION: ${S3_REGION:-eu-west-1}
      # URL publique présentée dans les URLs présignées + redirection console.
      # IMPORTANT : doit pointer en HTTPS vers Traefik, sinon mixed-content
      # côté navigateur (la page est HTTPS, l'audio en HTTP → blocage).
      MINIO_SERVER_URL: https://${MINIO_S3_HOST:?must be set}
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_HOST:?must be set}
    volumes:
      - codir_minio_data:/data
    networks: [codir_network, proxy]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging_rotated
    cpus: "1.5"
    mem_limit: 2048m
    mem_reservation: 512m
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # ── Endpoint S3 (URLs présignées audio + uploads) ────────
      - traefik.http.routers.codir-minio-s3.rule=Host(`${MINIO_S3_HOST}`)
      - traefik.http.routers.codir-minio-s3.entrypoints=websecure
      - traefik.http.routers.codir-minio-s3.tls=true
      - traefik.http.routers.codir-minio-s3.tls.certresolver=lets
      - traefik.http.routers.codir-minio-s3.service=codir-minio-s3-svc
      - traefik.http.services.codir-minio-s3-svc.loadbalancer.server.port=9000
      - traefik.http.services.codir-minio-s3-svc.loadbalancer.server.scheme=http

      # ── Console admin web (accès restreint via IP allowlist conseillé) ─
      - traefik.http.routers.codir-minio-console.rule=Host(`${MINIO_CONSOLE_HOST}`)
      - traefik.http.routers.codir-minio-console.entrypoints=websecure
      - traefik.http.routers.codir-minio-console.tls=true
      - traefik.http.routers.codir-minio-console.tls.certresolver=lets
      - traefik.http.routers.codir-minio-console.service=codir-minio-console-svc
      - traefik.http.services.codir-minio-console-svc.loadbalancer.server.port=9001
      - traefik.http.services.codir-minio-console-svc.loadbalancer.server.scheme=http

  # ── MinIO bucket-init (one-shot) ────────────────────────────────
  # Crée les buckets nécessaires au premier démarrage via mc (client officiel).
  # `codirweb` attend que ce service ait fini (service_completed_successfully)
  # avant de démarrer Django.
  codirminio_init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    restart: "no"
    depends_on:
      codirminio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must be set}
      S3_BUCKET: ${S3_BUCKET:-codir-prod}
      RECORDING_S3_BUCKET: ${RECORDING_S3_BUCKET:-codir-recordings-prod}
    entrypoint: >
      sh -c "
        set -e ;
        echo 'Configuration mc alias…' ;
        mc alias set codir http://codirminio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" ;
        echo 'Création bucket documents (S3_BUCKET=\"'$$S3_BUCKET'\")…' ;
        mc mb --ignore-existing codir/\"$$S3_BUCKET\" ;
        mc anonymous set none codir/\"$$S3_BUCKET\" ;
        echo 'Création bucket recordings (RECORDING_S3_BUCKET=\"'$$RECORDING_S3_BUCKET'\")…' ;
        mc mb --ignore-existing codir/\"$$RECORDING_S3_BUCKET\" ;
        mc anonymous set none codir/\"$$RECORDING_S3_BUCKET\" ;
        echo 'Buckets prêts. Liste :' ;
        mc ls codir/ ;
        echo 'OK' ;
      "
    networks: [codir_network]
    logging: *logging_rotated

  # ── API Django (Gunicorn) ─────────────────────────────────────
  # Le script docker-entrypoint.sh fait : wait DB → migrate → collectstatic → gunicorn
  codirweb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: ${CODIR_IMAGE:-codir-api:latest}
    command: ["/app/scripts/docker-entrypoint.sh", "prod"]
    env_file: [.env.prod]
    environment:
      <<: *common-env
    volumes:
      - codir_static:/app/staticfiles:rw
      - codir_media:/var/www/media:rw
      - codir_logs:/app/logs:rw
    depends_on:
      codirDB:
        condition: service_healthy
      codirredis:
        condition: service_healthy
      # MinIO doit être healthy + buckets créés avant que Django démarre.
      codirminio:
        condition: service_healthy
      codirminio_init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [codir_network, proxy]
    init: true
    healthcheck:
      # - Host header → ALLOWED_HOSTS (sinon DisallowedHost)
      # - X-Forwarded-Proto: https → SECURE_PROXY_SSL_HEADER (sinon 301 vers HTTPS)
      test: [
        "CMD", "curl", "-fsS",
        "-H", "Host: codirweb",
        "-H", "X-Forwarded-Proto: https",
        "http://127.0.0.1:8000/health/"
      ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    shm_size: "256m"
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile: 65535
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # ── Routeur AUTH (rate-limit serré, brute-force) ─────────
      - traefik.http.routers.codir-auth.rule=Host(`${CODIR_API_HOST}`) && PathPrefix(`/api/v1/auth/`)
      - traefik.http.routers.codir-auth.entrypoints=websecure
      - traefik.http.routers.codir-auth.tls=true
      - traefik.http.routers.codir-auth.tls.certresolver=lets
      - traefik.http.routers.codir-auth.service=codir-api-svc
      - traefik.http.routers.codir-auth.middlewares=codir-sec-headers@docker,codir-compress@docker,codir-rl-auth@docker
      - traefik.http.routers.codir-auth.priority=200

      # ── Routeur UPLOAD audio (gros payloads, sans rate-limit, sans compression) ──
      # Priorité 150 → matche AVANT le routeur API générique (100).
      # Pas de codir-rl (les 250 req burst dépassés inutilement par un upload
      # multipart chunked) ni codir-compress (compresser de l'audio déjà
      # compressé est contre-productif). Pas de buffering Traefik → stream
      # direct vers Django, RAM low côté Traefik.
      - traefik.http.routers.codir-upload.rule=Host(`${CODIR_API_HOST}`) && (PathRegexp(`^/api/v1/meetings/[^/]+/recordings/`) || PathPrefix(`/api/v1/recordings/`))
      - traefik.http.routers.codir-upload.entrypoints=websecure
      - traefik.http.routers.codir-upload.tls=true
      - traefik.http.routers.codir-upload.tls.certresolver=lets
      - traefik.http.routers.codir-upload.service=codir-api-svc
      - traefik.http.routers.codir-upload.middlewares=codir-sec-headers@docker
      - traefik.http.routers.codir-upload.priority=150

      # ── Routeur API générique ────────────────────────────────
      # NB: PathPrefix `/admin` (sans slash) pour matcher aussi /admin → Django admin
      - traefik.http.routers.codir-api.rule=Host(`${CODIR_API_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/docs`) || PathPrefix(`/health`) || PathPrefix(`/static`) || PathPrefix(`/media`))
      - traefik.http.routers.codir-api.entrypoints=websecure
      - traefik.http.routers.codir-api.tls=true
      - traefik.http.routers.codir-api.tls.certresolver=lets
      - traefik.http.routers.codir-api.service=codir-api-svc
      - traefik.http.routers.codir-api.middlewares=codir-sec-headers@docker,codir-compress@docker,codir-rl@docker
      - traefik.http.routers.codir-api.priority=100

      - traefik.http.services.codir-api-svc.loadbalancer.server.port=8000
      - traefik.http.services.codir-api-svc.loadbalancer.server.scheme=http

      # ── Middlewares ─────────────────────────────────────────
      - traefik.http.middlewares.codir-sec-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.codir-sec-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.codir-sec-headers.headers.stsPreload=true
      - traefik.http.middlewares.codir-sec-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.codir-sec-headers.headers.frameDeny=true
      - traefik.http.middlewares.codir-sec-headers.headers.browserXssFilter=true
      - traefik.http.middlewares.codir-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.codir-compress.compress=true
      - traefik.http.middlewares.codir-rl.ratelimit.average=150
      - traefik.http.middlewares.codir-rl.ratelimit.burst=250
      - traefik.http.middlewares.codir-rl-auth.ratelimit.average=10
      - traefik.http.middlewares.codir-rl-auth.ratelimit.burst=20
    logging: *logging_rotated
    cpus: "1.5"
    mem_limit: 1024m
    mem_reservation: 512m

  # ── ASGI / WebSocket (Daphne) ────────────────────────────────
  # Attend que codirweb soit healthy (= migrations faites)
  codirasgi:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: ${CODIR_IMAGE:-codir-api:latest}
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "--proxy-headers", "config.asgi:application"]
    env_file: [.env.prod]
    environment:
      <<: *common-env
    depends_on:
      codirweb:
        condition: service_healthy
    restart: unless-stopped
    networks: [codir_network, proxy]
    init: true
    read_only: true
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    security_opt:
      - "no-new-privileges:true"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.codir-ws.rule=Host(`${CODIR_API_HOST}`) && PathPrefix(`/ws/`)
      - traefik.http.routers.codir-ws.entrypoints=websecure
      - traefik.http.routers.codir-ws.tls=true
      - traefik.http.routers.codir-ws.tls.certresolver=lets
      - traefik.http.routers.codir-ws.service=codir-ws-svc
      - traefik.http.routers.codir-ws.priority=300
      - traefik.http.services.codir-ws-svc.loadbalancer.server.port=8001
    logging: *logging_rotated
    cpus: "0.7"
    mem_limit: 512m
    mem_reservation: 256m

  # ── Celery workers ───────────────────────────────────────────
  codirworker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: ${CODIR_IMAGE:-codir-api:latest}
    command: >
      celery -A config worker
      -Q default,celery,notifications,reports,recordings
      --loglevel=warning
      --concurrency=${CELERY_CONCURRENCY:-2}
      --prefetch-multiplier=1 -Ofair
      --max-tasks-per-child=200
      --without-gossip --without-mingle
    env_file: [.env.prod]
    environment:
      <<: *common-env
      CELERY_WORKER_MAX_MEMORY_PER_CHILD: "200000"   # 200 MB
    depends_on:
      codirDB:
        condition: service_healthy
      codirredis:
        condition: service_healthy
      codirweb:
        condition: service_healthy   # attend migrations
    restart: unless-stopped
    networks: [codir_network]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'celery worker' | grep -v grep >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    logging: *logging_rotated
    cpus: "1.0"
    mem_limit: 768m
    mem_reservation: 384m
    ulimits:
      nofile: 65535

  # ── Celery beat ──────────────────────────────────────────────
  codirbeat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: ${CODIR_IMAGE:-codir-api:latest}
    command: >
      celery -A config beat
      --loglevel=warning
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
      --pidfile=/tmp/celerybeat.pid
    env_file: [.env.prod]
    environment:
      <<: *common-env
    depends_on:
      codirDB:
        condition: service_healthy
      codirredis:
        condition: service_healthy
      codirweb:
        condition: service_healthy   # attend migrations
    restart: unless-stopped
    networks: [codir_network]
    tmpfs:
      - "/tmp:size=64m,mode=1777"
    logging: *logging_rotated
    cpus: "0.3"
    mem_limit: 256m
    mem_reservation: 128m

  # ── Frontend SPA (Nginx interne, exposé via Traefik) ─────────
  codirfront:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:?must be set}
        VITE_FRONTEND_URL: ${FRONTEND_BASE_URL}
    image: ${CODIR_WEB_IMAGE:-codir-web:latest}
    restart: unless-stopped
    depends_on: [codirweb]
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Router HTTPS (TLS via Let's Encrypt — peut être rate-limited mais router toujours actif)
      - traefik.http.routers.codir-web.rule=Host(`${CODIR_HOST}`)
      - traefik.http.routers.codir-web.entrypoints=websecure
      - traefik.http.routers.codir-web.tls=true
      - traefik.http.routers.codir-web.tls.certresolver=lets
      - traefik.http.routers.codir-web.service=codir-web-svc
      - traefik.http.routers.codir-web.priority=1
      # Router HTTP de secours (pour valider le routage sans dépendre du cert)
      - traefik.http.routers.codir-web-http.rule=Host(`${CODIR_HOST}`)
      - traefik.http.routers.codir-web-http.entrypoints=web
      - traefik.http.routers.codir-web-http.service=codir-web-svc
      - traefik.http.routers.codir-web-http.priority=1
      # Service
      - traefik.http.services.codir-web-svc.loadbalancer.server.port=80
      - traefik.http.services.codir-web-svc.loadbalancer.server.scheme=http
    logging: *logging_rotated
    cpus: "0.3"
    mem_limit: 256m
    mem_reservation: 128m

  # ── Management one-shot (migrations, shell, createsuperuser…) ──
  codirmanage:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: ${CODIR_IMAGE:-codir-api:latest}
    env_file: [.env.prod]
    environment:
      <<: *common-env
    networks: [codir_network]
    depends_on:
      codirDB:
        condition: service_healthy
      codirredis:
        condition: service_healthy
    read_only: false   # writable pour générer des migrations
    volumes:
      - ./backend:/app:rw
      - codir_static:/app/staticfiles:rw
      - codir_media:/var/www/media:rw
      - codir_logs:/app/logs:rw
    command: sleep infinity
    profiles: ["manage"]    # ne démarre que via `--profile manage`

# ─────────────────────────────────────────────────────────────────

volumes:
  codir_pgdata:
  codir_redisdata:
  codir_static:
  codir_media:
  codir_logs:
  codir_minio_data:

networks:
  codir_network:
    name: codir_network
  proxy:
    external: true
