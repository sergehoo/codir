# Traefik — configuration statique CODIR.
# Variables d'env attendues (cf. .env.prod) :
#   TRAEFIK_ACME_EMAIL  — email Let's Encrypt
#   TRAEFIK_DASHBOARD   — true/false (dashboard sur 8080 protégé)

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ─── Entrypoints ───────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - secure-headers@file

# ─── Providers ─────────────────────────────────────────────────
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: codir-prod
  file:
    directory: /etc/traefik/dynamic
    watch: true

# ─── Let's Encrypt ─────────────────────────────────────────────
certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{env \"TRAEFIK_ACME_EMAIL\"}}"
      storage: /acme/acme.json
      tlsChallenge: {}
      # Pour les domaines wildcards : configurer DNS challenge dans .env.prod
      # httpChallenge:
      #   entryPoint: web

# ─── Logs & metrics ────────────────────────────────────────────
log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "400-599"

# ─── API / Dashboard (optionnel — derrière auth) ───────────────
api:
  dashboard: true
  insecure: false   # accès uniquement via routeur explicite
