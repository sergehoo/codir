# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — environnement de DÉVELOPPEMENT CODIR
#
# Lance la stack complète : Postgres, Redis, OpenSearch, MinIO,
# MailHog, Ollama (profil ai), API Django, ASGI Daphne, Celery
# workers (default/notifications/ai/reports), Celery beat, Flower.
#
# Lancement minimal :
#     docker compose up postgres redis api
# Stack complète :
#     docker compose up
# Avec IA locale :
#     docker compose --profile ai up
# Pour la prod, voir docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────

# Ancres réutilisables (définies AVANT usage)
x-common-env: &common-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-CHANGE-ME-in-prod}
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "*"
  # DB
  POSTGRES_DB: codir
  POSTGRES_USER: codir
  POSTGRES_PASSWORD: codir
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  # Cache / Queue
  REDIS_URL: redis://:codir@redis:6379/0
  CELERY_BROKER_URL: redis://:codir@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:codir@redis:6379/1
  # Storage
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: codir
  S3_SECRET_KEY: codirminio
  S3_BUCKET: codir-dev
  S3_REGION: eu-west-1
  # Search
  OPENSEARCH_URL: http://opensearch:9200
  # Email
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailhog
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"
  DEFAULT_FROM_EMAIL: "CODIR Executive <no-reply@codir.local>"
  # AI
  OLLAMA_URL: http://ollama:11434
  # CORS / TZ
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
  CELERY_TIMEZONE: Africa/Abidjan
  FRONTEND_BASE_URL: http://localhost:5173

x-app-build: &app-build
  build:
    context: .
    target: runtime
  image: codir-api:dev
  volumes:
    - .:/app
  restart: unless-stopped

# ─────────────────────────────────────────────────────────────────
# Services
# ─────────────────────────────────────────────────────────────────

services:

  # ── Bases & messaging ──────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: codir
      POSTGRES_USER: codir
      POSTGRES_PASSWORD: codir
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codir -d codir"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [
      "redis-server",
      "--requirepass", "codir",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru",
      "--appendonly", "yes"
    ]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "codir", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=Codir@Search2026!"
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.disabled=true
    ports: ["9200:9200"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    restart: unless-stopped
    profiles: ["search"]

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: codir
      MINIO_ROOT_PASSWORD: codirminio
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Crée le bucket par défaut au démarrage
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 codir codirminio &&
      mc mb -p local/codir-dev || true &&
      mc anonymous set download local/codir-dev || true
      "
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.3.13
    ports: ["11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
    profiles: ["ai"]
    restart: unless-stopped

  # ── Application ────────────────────────────────────────────────

  api:
    <<: *app-build
    command: ["/app/scripts/docker-entrypoint.sh", "dev"]
    environment:
      <<: *common-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  asgi:
    <<: *app-build
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "config.asgi:application"]
    environment:
      <<: *common-env
    ports: ["8001:8001"]
    depends_on:
      api: { condition: service_healthy }

  worker-default:
    <<: *app-build
    command: ["celery", "-A", "config", "worker", "-Q", "default,celery", "-l", "info", "-n", "default@%h"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  worker-notifications:
    <<: *app-build
    command: ["celery", "-A", "config", "worker", "-Q", "notifications", "-l", "info", "-n", "notifications@%h", "--concurrency=2"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  worker-ai:
    <<: *app-build
    command: ["celery", "-A", "config", "worker", "-Q", "ai", "-l", "info", "-n", "ai@%h", "--concurrency=2"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }
    profiles: ["ai"]

  worker-reports:
    <<: *app-build
    command: ["celery", "-A", "config", "worker", "-Q", "reports", "-l", "info", "-n", "reports@%h"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *app-build
    command: ["celery", "-A", "config", "beat", "-l", "info", "-S", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      <<: *common-env
    depends_on:
      api: { condition: service_healthy }

  flower:
    <<: *app-build
    command: ["celery", "-A", "config", "flower", "--port=5555", "--basic_auth=admin:codir-flower"]
    environment:
      <<: *common-env
    ports: ["5555:5555"]
    depends_on:
      worker-default: { condition: service_started }

# ─────────────────────────────────────────────────────────────────

volumes:
  postgres-data:
  redis-data:
  opensearch-data:
  minio-data:
  ollama-data:

networks:
  default:
    name: codir-dev
