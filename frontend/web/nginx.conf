server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA — fallback sur index.html pour les routes client ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache assets immutables (Vite ajoute des hashes) ─────
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Sécurité ─────────────────────────────────────────────
    add_header X-Frame-Options "DENY"           always;
    add_header X-Content-Type-Options "nosniff"  always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions matérielles :
    # - microphone=(self)  → MeetingRecorder peut capter le micro (réunions CODIR).
    # - camera=()          → webcam désactivée (sécurité).
    # - geolocation=()     → géolocalisation désactivée.
    # (self) = uniquement l'origine du site (pas les iframes tierces).
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;
}
