server {
    listen 80;
    server_name _;

    # ── Upload audio long : 600 Mo max (défense en profondeur) ──────
    # Normalement Traefik route /api/* directement vers le backend Django
    # via le router codir-api/codir-upload. Mais si pour une raison X
    # (bug routing, fallback), une requête passe par ce nginx, on évite
    # de tuer un upload de 100 Mo+ avec la limite par défaut (1 Mo).
    client_max_body_size 600M;
    client_body_timeout 600s;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA — fallback sur index.html pour les routes client ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache assets immutables (Vite ajoute des hashes) ─────
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── PAS de cache sur index.html ──────────────────────────
    # L'HTML pointe vers les bundles JS/CSS avec hashes — on doit toujours
    # récupérer la dernière version pour avoir les bonnes références aux
    # assets actuels. Sans ça, le navigateur peut servir un ancien HTML qui
    # pointe vers un bundle JS qui n'existe plus (404) ou pire, un ancien
    # bundle JS qui plante.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Sécurité ─────────────────────────────────────────────
    add_header X-Frame-Options "DENY"           always;
    add_header X-Content-Type-Options "nosniff"  always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions matérielles :
    # - microphone=(self)  → MeetingRecorder peut capter le micro (réunions CODIR).
    # - camera=()          → webcam désactivée (sécurité).
    # - geolocation=()     → géolocalisation désactivée.
    # (self) = uniquement l'origine du site (pas les iframes tierces).
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # ── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml;
}
